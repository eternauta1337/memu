# Qué dependencias tienen permiso de correr sus build scripts (better-sqlite3 y esbuild son
# nativos: sin esto se instalan sin el .node y todo revienta al primer require).
#
# Van las DOS claves a propósito: pnpm 10 lee `onlyBuiltDependencies` y no conoce `allowBuilds`;
# pnpm 11 ya no lee `onlyBuiltDependencies` (ni el campo `pnpm` de package.json) y espera
# `allowBuilds`. Cada versión ignora la ajena, así que el repo funciona con las dos.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
